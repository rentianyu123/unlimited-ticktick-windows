name: Build and Release Patched TickTick

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag 名称（若在'Use workflow from'直接选了Tag，此处可留空）"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Patched TickTick
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Download TickTick Setup from Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动获取目标 Tag：优先使用手输 input，若为空则自动获取触发时的 Tag 名称
          $targetTag = "${{ inputs.tag_name }}".Trim()
          if (-not $targetTag) {
            $targetTag = "${{ github.ref_name }}"
          }

          Write-Host "Target Tag: $targetTag"

          # 使用 gh 命令行工具自动鉴权下载该 Release 中的 exe 文件
          # pattern "*.exe" 会匹配附件中的 exe（忽略大小写）
          gh release download "$targetTag" --repo "${{ github.repository }}" --pattern "*.exe" --dir "."

          # 寻找下载完成的 exe 文件并统一重命名为 TickTick.exe 供补丁工具使用
          $downloadedExe = Get-ChildItem -Filter "*.exe" | Where-Object { $_.Name -notlike "*Patched*" } | Select-Object -First 1

          if (-not $downloadedExe) {
            Write-Error "未在 Release [$targetTag] 中找到任何 .exe 附件，请检查该 Tag 的 Release 内容。"
            exit 1
          }

          Write-Host "找到目标文件: $($downloadedExe.Name)，正在准备运行补丁..."
          if ($downloadedExe.Name -ne "TickTick.exe") {
            Move-Item -Path $downloadedExe.FullName -Destination "TickTick.exe" -Force
          }

      - name: Run Patcher
        run: dotnet run -- "TickTick.exe"

      - name: Prepare Release Package
        shell: pwsh
        run: |
          if (-not (Test-Path "TickTick_Patched.exe")) {
            Write-Error "Patching failed: TickTick_Patched.exe not generated."
            exit 1
          }
          Compress-Archive -Path "TickTick_Patched.exe" -DestinationPath "TickTick_Patched.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Patched TickTick (${{ github.run_number }})
          tag_name: patched-${{ github.run_number }}
          files: TickTick_Patched.zip
          draft: true

      - name: Output Release URL
        shell: pwsh
        run: |
          Write-Host "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
